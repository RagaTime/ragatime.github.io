# Source: https://chatgpt.com/c/69fb633b-ea50-83e8-b6f8-301e87f0293e
name: Deploy + Notify
permissions:
  contents: write

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Learn: `peaceiris/actions-gh-pages` deploys the code only. Build happens in `pages
      #        build and deployment` workflow automaitcally by github and then this workflow
      #        is triggered and deploys the built code to GitHub Pages.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist   # change as needed

      #   To test failure telegram notification, uncomment the following step to force a failure
    #   - name: Force failure (test)
    #     run: exit 1

      - name: Notify Telegram (on success)
        if: success()
        run: |
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ Deployment successful: https://ragatime.github.io"
      - name: Notify Telegram (on failure)
        if: failure()
        run: |
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ Deployment failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
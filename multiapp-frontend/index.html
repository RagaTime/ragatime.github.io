<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LineFlow — One Line at a Time</title>
    <!-- For PWA -->
    <!-- Manifest -->
    <meta name="theme-color" content="#000000">
    <!-- Optional favicon -->
    <link rel="icon" href="/manifest-assets-app1/icon-192.png" sizes="192x192">

</head>

<body>
    <style>
        .status-lable {
            color: white;
            background: black;
            padding: 0px 5px;
            margin-right: 5px;
            width: fit-content;
        }
        pre{
            margin: 0;
        }
    </style>
    <button id="btn-install-app1" type="button">Install App 1</button>
    <button id="btn-install-app2" type="button">Install App 2</button>
    <div style="display: flex; margin-top: 10px;">
        <div class="status-lable">Manifest Load Status:</div>
        <div id="manifest-status">No app loaded yet.</div>
    </div>
    <hr />
    <div style="display: flex;">
        <div class="status-lable">Install Status:</div>
        <div id="install-status">Install prompt not available yet.</div>
    </div>
    <hr />
    <div class="status-lable">Logs:</div>
    <pre id="log-before-install-prompt"></pre>

    <script>
        const $ = document.querySelector.bind(document);
        const $$ = document.querySelectorAll.bind(document); // optional for multiple elements

        const manifestStatus = $('#manifest-status');
        const btnInstallApp1 = $('#btn-install-app1');
        const btnInstallApp2 = $('#btn-install-app2');
        const installStatus = $('#install-status');
        const manifestLinkId = 'lineflow-manifest-link';
        const manifests = {
            app1: {
                label: 'App 1',
                href: '/manifest-assets-app1/manifest.json',
                icon: '/manifest-assets-app1/icon-192.png',
            },
            app2: {
                label: 'App 2',
                href: '/manifest-assets-app2/manifest.json',
                icon: '/manifest-assets-app2/icon-192.png',
            },
        };

        let activeManifestKey = null;
        let installPromptEvent = null;
        let installPromptInProgress = false;

        const updateManifestStatus = () => {
            const activeManifest = activeManifestKey ? manifests[activeManifestKey] : null;
            manifestStatus.textContent = activeManifest ? `${activeManifest.label} manifest loaded.` : 'No app loaded yet.';
            if (!activeManifest) {
                installStatus.textContent = 'Load a app manifest to enable install.';
                return;
            }
            installStatus.textContent = installPromptEvent ? `Install is ready for ${activeManifest.label}.` : `${activeManifest.label} manifest is loaded, but install prompt is not ready yet.`;
        };

        const promptInstall = async () => {
            if (!installPromptEvent || installPromptInProgress) {
                if (!installPromptEvent) { alert('Install prompt is not available yet. Please wait until the app is ready.'); }
                if (installPromptInProgress) { alert('An install prompt is already in progress. Please complete it before trying again.'); }
                return;
            }
            console.log('promptInstall - Installing..');

            installPromptInProgress = true;
            try {
                const result = await installPromptEvent.prompt();
                installStatus.textContent = `Install prompt was ${result.outcome}.`;
            } finally {
                installPromptEvent = null;
                installPromptInProgress = false;
                updateManifestStatus();
            }
        };

        const loadManifest = (manifestKey) => {
            const manifest = manifests[manifestKey];
            if (!manifest) { return; }
            // Learn: Removing the existing manifest link is helpful
            //        in case when I want called installing app1 and
            //        then retry installing app1 again otherwise the
            //        browser doesn't trigger beforeinstallprompt
            //        because the manifest link is already loaded.
            $('#lineflow-manifest-link')?.remove();

            let link = document.createElement('link');
            link.id = manifestLinkId;
            link.rel = 'manifest';
            document.head.appendChild(link);
            link.href = manifest.href;

            const favicon = document.querySelector('link[rel="icon"]');
            if (favicon) {
                favicon.href = manifest.icon;
            }

            activeManifestKey = manifestKey;
            updateManifestStatus();
        };

        window.addEventListener('beforeinstallprompt', (event) => {
            event.preventDefault();
            // console.log('❤️beforeinstallprompt.')
            $('#log-before-install-prompt').textContent += '\n❤️beforeinstallprompt event fired!';
            console.log("🚀 ~ installPromptEvent?", installPromptEvent);
            installPromptEvent = event;
            updateManifestStatus();
            promptInstall();
        });

        btnInstallApp1.addEventListener('click', () => loadManifest('app1'));
        btnInstallApp2.addEventListener('click', () => loadManifest('app2'));

        updateManifestStatus();
    </script>
</body>

</html>

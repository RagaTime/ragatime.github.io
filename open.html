<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Open link</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f8fa;
        }

        main {
            text-align: center;
            padding: 24px;
        }

        #open-button {
            min-width: 220px;
            padding: 24px 56px;
            border: 0;
            border-radius: 16px;
            background: #1769e0;
            color: white;
            font: inherit;
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 24px rgb(23 105 224 / 25%);
        }

        #open-button:hover:not(:disabled) {
            background: #1058c3;
        }

        #open-button:focus-visible {
            outline: 4px solid #9cc3ff;
            outline-offset: 4px;
        }

        #open-button:disabled {
            background: #9aa4b2;
            box-shadow: none;
            cursor: not-allowed;
        }

        #message {
            min-height: 1.5em;
            margin: 20px 0 0;
            color: #555;
        }
    </style>
</head>

<body>
    <main>
        <button id="open-button" type="button" disabled>Open</button>
        <p id="message" role="status" aria-live="polite"></p>
    </main>

    <script>
        const button = document.getElementById("open-button");
        const message = document.getElementById("message");
        const rawUrl = new URLSearchParams(window.location.search).get("url");
        let destination;

        try {
            destination = new URL(rawUrl);
            if (destination.protocol !== "https:" && destination.protocol !== "http:") {
                destination = null;
            }
        } catch {
            destination = null;
        }

        if (destination) {
            button.disabled = false;
            button.addEventListener("click", () => {
                window.location.assign(destination.href);
            });
        }
    </script>
</body>

</html>
